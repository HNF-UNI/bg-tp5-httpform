<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéPass - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎬 CinéPass</h1>
            <p>Inscription au Club de Cinéma - Saison 2025</p>
        </header>

        <!-- action + method post, slides 93-94 -->
        <form action="page_traitement" method="post">
            <div class="info-box">💡 Rejoignez notre club et profitez de tarifs réduits, d'avant-premières exclusives et de rencontres avec des réalisateurs !</div>

            <div class="section">
                <h2>👤 Informations personnelles</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="prenom">Prénom :</label>
                        <input type="text" id="prenom" name="prenom" placeholder="Ex: Ahmed" required>
                    </div>
                    <div class="form-group">
                        <label for="nom">Nom :</label>
                        <input type="text" id="nom" name="nom" placeholder="Ex: Bensalem" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Adresse email :</label>
                    <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
                </div>
                <div class="form-group">
                    <label for="pwd">Mot de passe (compte en ligne) :</label>
                    <input type="password" id="pwd" name="pwd" placeholder="Minimum 8 caractères" minlength="8" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Téléphone :</label>
                        <input type="tel" id="phone" name="phone" placeholder="0555123456" pattern="[0-9]{10}">
                    </div>
                    <div class="form-group">
                        <label for="naissance">Date de naissance :</label>
                        <input type="date" id="naissance" name="naissance">
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
