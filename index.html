<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéPass - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎬 CinéPass</h1>
            <p>Inscription au Club de Cinéma - Saison 2025</p>
        </header>

        <!-- action + method post, slides 93-94 -->
        <form action="page_traitement" method="post">
            <div class="info-box">💡 Rejoignez notre club et profitez de tarifs réduits, d'avant-premières exclusives et de rencontres avec des réalisateurs !</div>

            <div class="section">
                <h2>👤 Informations personnelles</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="prenom">Prénom :</label>
                        <input type="text" id="prenom" name="prenom" placeholder="Ex: Ahmed" required>
                    </div>
                    <div class="form-group">
                        <label for="nom">Nom :</label>
                        <input type="text" id="nom" name="nom" placeholder="Ex: Bensalem" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Adresse email :</label>
                    <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
                </div>
                <div class="form-group">
                    <label for="pwd">Mot de passe (compte en ligne) :</label>
                    <input type="password" id="pwd" name="pwd" placeholder="Minimum 8 caractères" minlength="8" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Téléphone :</label>
                        <input type="tel" id="phone" name="phone" placeholder="0555123456" pattern="[0-9]{10}">
                    </div>
                    <div class="form-group">
                        <label for="naissance">Date de naissance :</label>
                        <input type="date" id="naissance" name="naissance">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>🎫 Formule d'abonnement</h2>
                <fieldset>
                    <legend>Choisissez votre formule :</legend>
                    <div class="option">
                        <input type="radio" id="basique" name="formule" value="basique" checked>
                        <label for="basique">🥉 Basique - 4 séances/mois (2000 DA/mois)</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="premium" name="formule" value="premium">
                        <label for="premium">🥈 Premium - 10 séances/mois (4500 DA/mois)</label>
                    </div>
                    <div class="option">
                        <input type="radio" id="illimite" name="formule" value="illimite">
                        <label for="illimite">🥇 Illimité - Séances illimitées (7000 DA/mois)</label>
                    </div>
                </fieldset>
                <div class="form-row">
                    <div class="form-group">
                        <label for="debut">Date de début souhaité :</label>
                        <input type="month" id="debut" name="debut">
                    </div>
                    <div class="form-group">
                        <label for="duree">Durée d'engagement :</label>
                        <select id="duree" name="duree">
                            <option value="">-- Sélectionner --</option>
                            <option value="3">3 Mois</option>
                            <option value="6">6 Mois (-5%)</option>
                            <option value="12">12 Mois (-10%)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="accompagnants">Nombre d'accompagnants habituels :</label>
                    <input type="number" id="accompagnants" name="accompagnants" value="0" min="0">
                </div>
            </div>
        </form>
    </div>
</body>
</html>
